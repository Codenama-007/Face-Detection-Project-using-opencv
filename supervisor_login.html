<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Authentication | ProctorAI SOC</title>
    <meta name="description" content="Supervisor Command Authentication Portal for ProctorAI Security Operations Center.">
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
/* ═════════════════════════════════════════════════════════════════════
   PROCTORAI — SUPERVISOR COMMAND AUTHENTICATION
   National Examination Security Operations Center Access Portal
   ═════════════════════════════════════════════════════════════════════ */

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg-base:        #06090e;
    --bg-surface:     #080c14;
    --bg-elevated:    #0e1422;
    
    --panel-glass:    rgba(14, 20, 34, 0.85);
    --border-subtle:  rgba(255, 255, 255, 0.06);
    --border-light:   rgba(255, 255, 255, 0.12);
    --border-hover:   rgba(56, 189, 248, 0.32);
    
    --cyan:           #00e5ff;
    --cyan-glow:      rgba(0, 229, 255, 0.35);
    --accent:         #38bdf8;
    
    --success:        #10b981;
    --danger:         #ef4444;
    --danger-dim:     rgba(239, 68, 68, 0.14);
    --danger-bd:      rgba(239, 68, 68, 0.35);
    
    --t1:             #f8fafc;
    --t2:             #94a3b8;
    --t3:             #64748b;
    --t4:             #334155;
    
    --font:           'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono:           'JetBrains Mono', 'SF Mono', Consolas, monospace;
}

body {
    font-family: var(--font);
    background-color: var(--bg-base);
    color: var(--t1);
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
    position: relative;
    overflow-x: hidden;
}

/* Background Atmosphere */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse 65% 45% at 50% 25%, rgba(14, 42, 80, 0.38) 0%, transparent 65%),
        radial-gradient(ellipse 50% 35% at 85% 85%, rgba(0, 229, 255, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 45% 35% at 15% 85%, rgba(56, 189, 248, 0.06) 0%, transparent 60%),
        var(--bg-base);
    pointer-events: none;
    z-index: 0;
}

body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(56, 189, 248, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.018) 1px, transparent 1px);
    background-size: 36px 36px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.8;
}

.container {
    position: relative;
    z-index: 1;
    background: var(--panel-glass);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--border-subtle);
    border-top: 1px solid var(--border-light);
    border-radius: 20px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55), 0 0 40px rgba(0, 229, 255, 0.05);
    padding: 2.5rem;
    width: 100%;
    max-width: 440px;
    text-align: center;
}

.logo-badge {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: rgba(0, 229, 255, 0.1);
    border: 1px solid rgba(0, 229, 255, 0.3);
    color: var(--cyan);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.25rem;
    box-shadow: 0 0 24px rgba(0, 229, 255, 0.25);
}

.logo-badge svg {
    width: 28px;
    height: 28px;
}

h2 {
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 60%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.35rem;
}

p {
    color: var(--t2);
    margin-bottom: 2rem;
    font-size: 0.82rem;
    line-height: 1.5;
}

.input-group {
    margin-bottom: 1.25rem;
    text-align: left;
}

.input-group label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    margin-bottom: 0.4rem;
    color: var(--t2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
}

.input-group input {
    width: 100%;
    padding: 0.85rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--border-light);
    background: rgba(6, 9, 14, 0.75);
    color: #fff;
    font-family: var(--font);
    font-size: 0.92rem;
    outline: none;
    transition: all 0.2s ease;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
}

.input-group input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.20), inset 0 2px 6px rgba(0, 0, 0, 0.3);
    background: rgba(14, 20, 34, 0.9);
}

.input-group input::placeholder {
    color: var(--t3);
}

.btn {
    background: linear-gradient(135deg, #1d4ed8 0%, #0284c7 60%, #00e5ff 100%);
    color: #ffffff;
    border: 1px solid rgba(56, 189, 248, 0.4);
    padding: 0.9rem 1.5rem;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.88rem;
    font-family: var(--font);
    letter-spacing: 0.02em;
    cursor: pointer;
    width: 100%;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    box-shadow: 0 4px 18px rgba(37, 99, 235, 0.35);
    margin-top: 0.5rem;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}

.btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(0, 229, 255, 0.45);
}

.btn:disabled {
    background: rgba(255, 255, 255, 0.06);
    border-color: var(--border-subtle);
    cursor: not-allowed;
    color: var(--t3);
    box-shadow: none;
    transform: none;
}

.message {
    margin-top: 1rem;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    display: none;
    background: var(--danger-dim);
    color: #f87171;
    border: 1px solid var(--danger-bd);
    box-shadow: 0 0 16px rgba(239, 68, 68, 0.25);
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
}

.back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    margin-top: 1.75rem;
    color: var(--t3);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 600;
    transition: all 0.2s;
}

.back-link:hover {
    color: var(--cyan);
    transform: translateX(-2px);
}

.lucide-spin {
    animation: spin 1s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-badge">
            <i data-lucide="shield-check"></i>
        </div>
        <h2>Supervisor Command Access</h2>
        <p>Authenticate with credentials to access the ProctorAI Examination Defense Matrix.</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Command Username</label>
                <input type="text" id="username" placeholder="admin" required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="password">Security Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn" id="loginBtn">
                <i data-lucide="log-in"></i> Authenticate & Enter SOC
            </button>

            <div id="statusMsg" class="message"></div>
        </form>
        
        <a href="index.html" class="back-link">
            <i data-lucide="arrow-left" style="width:12px;height:12px;"></i>
            Back to Platform Overview
        </a>
    </div>

    <script>
        lucide.createIcons();

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const statusMsg = document.getElementById('statusMsg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i data-lucide="loader" class="lucide-spin"></i> Verifying Command Clearance...';
            lucide.createIcons();
            statusMsg.style.display = 'none';

            try {
                const response = await fetch('/api/supervisor_login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    window.location.href = 'enrollment.html';
                } else {
                    statusMsg.textContent = result.error || 'Invalid credentials. Access denied.';
                    statusMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i data-lucide="log-in"></i> Authenticate & Enter SOC';
                    lucide.createIcons();
                }
            } catch (err) {
                statusMsg.textContent = 'Network error. Is the AI backend server running?';
                statusMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i data-lucide="log-in"></i> Authenticate & Enter SOC';
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
